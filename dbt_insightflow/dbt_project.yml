name: 'dbt_insightflow'
version: '1.0.0'
profile: 'insightflow_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Datasets are the profile's base dataset (`dbt`) plus the layer name:
# dbt_staging, dbt_intermediate, dbt_marts.
models:
  dbt_insightflow:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
