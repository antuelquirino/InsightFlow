version: 2

models:
  - name: stg_organizations
    columns:
      - name: organization_id
        tests:
          - not_null
          - unique

  - name: stg_users
    columns:
      - name: user_id
        tests:
          - not_null
          - unique

      - name: organization_id
        tests:
          - relationships:
              to: ref('stg_organizations')
              field: organization_id

  - name: stg_subscriptions
    columns:
      - name: subscription_id
        tests:
          - not_null
          - unique

      - name: organization_id
        tests:
          - relationships:
              to: ref('stg_organizations')
              field: organization_id

      - name: status
        tests:
          - accepted_values:
              values: ['active', 'canceled']

  - name: stg_product_events
    columns:
      - name: event_id
        tests:
          - not_null
          - unique

      - name: user_id
        tests:
          - relationships:
              to: ref('stg_users')
              field: user_id