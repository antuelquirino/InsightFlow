version: 2

sources:

  - name: raw
    database: insightflow-analytics-489617                # BigQuery dataset with synthetic data generated by Python pipeline
    description: "Raw tables generated by the Python pipeline for InsightFlow Analytics"
    schema: raw
    tables:
      - name: organizations
        description: "Information about each client organization of InsightFlow"
        columns:
          - name: organization_id
            description: "Unique ID for the organization"
          - name: name
            description: "Organization name"
          - name: industry
            description: "Industry of the organization"
          - name: created_at
            description: "Organization creation date"

      - name: users
        description: "Users belonging to each organization"
        columns:
          - name: user_id
            description: "Unique user ID"
          - name: organization_id
            description: "ID of the organization the user belongs to"
          - name: email
            description: "User's email"
          - name: first_name
            description: "User's first name"
          - name: last_name
            description: "User's last name"
          - name: created_at
            description: "User creation date"

      - name: subscriptions
        description: "Subscriptions for each organization with plan and MRR"
        columns:
          - name: subscription_id
            description: "Unique subscription ID"
          - name: organization_id
            description: "Organization ID"
          - name: plan_id
            description: "SaaS plan ID"
          - name: mrr
            description: "Monthly Recurring Revenue (MRR) in USD"
          - name: start_date
            description: "Subscription start date"
          - name: end_date
            description: "Subscription end date, if applicable"
          - name: status
            description: "Subscription status (active, canceled)"

      - name: product_events
        description: "Events generated by users within the platform"
        columns:
          - name: event_id
            description: "Unique event ID"
          - name: user_id
            description: "ID of the user who triggered the event"
          - name: organization_id
            description: "ID of the user's organization"
          - name: event_name
            description: "Event name (login, create_dashboard, view_dashboard, etc.)"
          - name: event_timestamp
            description: "Timestamp of when the event occurred"
