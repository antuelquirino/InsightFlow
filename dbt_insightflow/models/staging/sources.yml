version: 2

sources:
  - name: raw
    database: insightflow-analytics-489617
    schema: raw
    description: >
      Synthetic data written by `python -m data_generation.build` with a full
      refresh. See docs/data-stories.md for the stories hidden in it.
    tables:
      - name: organizations
        description: One row per organization that ever started a trial.
      - name: plans
        description: Plan prices with their validity range; one row per price version.
      - name: subscriptions
        description: >
          One row per subscription period, covering [start_date, end_date).
          Any plan, seat or price change closes a period and opens the next one
          on the same day. Trials are periods with is_trial = true and mrr = 0.
      - name: invoices
        description: One invoice per month of paid service.
      - name: product_events
        description: Weekly product activity per organization.
      - name: marketing_spend
        description: Monthly marketing spend per acquisition channel.
