insightflow_dbt:
  target: dev
  outputs:
    dev:
      type: bigquery
      # Application Default Credentials: `gcloud auth application-default login`,
      # or GOOGLE_APPLICATION_CREDENTIALS pointing to a service account key.
      # `dbt parse` (what CI runs) never opens a connection.
      method: oauth
      project: insightflow-analytics-489617
      dataset: dbt
      threads: 4
      timeout_seconds: 300
      location: EU
      maximum_bytes_billed: 1000000000
